[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal_mjx"
version = "0.2.0"
description = "Short description"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Neil Janwani", email = "njanwani@gatech.com" }
]
dependencies = [
  "numpy",
  "jax",
  "mujoco==3.17.0",
  "mujoco-mjx==3.17.0",
  "playground==0.2.0",
  "brax==0.14.2",
  "ml_collections",
  "pyyaml",
  "etils",
  "tqdm",
  "matplotlib",
  "mediapy",
  "pandas",
  "h5py",
  "wandb",
  "opencv-python",
]

[project.optional-dependencies]
dev = ["pytest", "black"]
docs = ["mkdocs-material", "mkdocstrings[python]", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
  "slow: JIT-heavy, rendering, or training tests (run with `-m slow` or `-m ''`)",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
